name: Fix Forsee Lens Selector link

on:
  push:
    branches:
      - codex/forsee-lens-guide
    paths:
      - .github/workflows/forsee-link-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/forsee-lens-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct current Lens Selector route
        run: python scripts/tmp-forsee-link-fix.py
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit link correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/forsee-lens-profile.mjs docs/forsee-lens-profile-sources.md js/analytics.js scripts/validate-analytics.mjs
          git commit -m "Use current Forsee Lens Selector route"
          git push origin HEAD:codex/forsee-lens-guide

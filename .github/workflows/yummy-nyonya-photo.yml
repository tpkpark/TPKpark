name: Finalise Yummy Nyonya Kitchen photo

on:
  push:
    branches:
      - codex/yummy-nyonya-photo
    paths:
      - .github/workflows/yummy-nyonya-photo.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/yummy-nyonya-photo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and verify supplied branch photograph
        run: |
          cat tmp/yummy-nyonya-photo.b64.* | base64 -d > assets/images/yummy-nyonya-kitchen-tpk-800.webp
          echo '9e6f44ec080adaf0fe2fc6e222ae672740c9ddf658c4ca47845492257b5c5c42  assets/images/yummy-nyonya-kitchen-tpk-800.webp' | sha256sum -c -
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p = 'assets/images/yummy-nyonya-kitchen-tpk-800.webp'
          im = Image.open(p)
          assert im.format == 'WEBP', im.format
          assert im.size == (800, 600), im.size
          print('Verified', p, im.size, im.format)
          PY
      - name: Use first-party storefront photo on the guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          image = 'https://www.tpkpark.com/assets/images/yummy-nyonya-kitchen-tpk-800.webp'

          p = Path('scripts/yummy-nyonya-profile.mjs')
          s = p.read_text()
          old = 'const image = "https://i.imgur.com/Z5h4hmH.jpg";'
          assert s.count(old) == 1
          s = s.replace(old, f'const image = "{image}";', 1)
          old = '  hasMap: directions,\n  address: {'
          assert s.count(old) == 1
          s = s.replace(old, '  hasMap: directions,\n  image,\n  address: {', 1)
          replacements = {
            'TPK Park Lifestyle frontage in Puchong, used as contextual imagery for the Yummy Nyonya Kitchen guide': 'Yummy Nyonya Kitchen storefront at 43G, Jalan TPK 2/8, TPK Park, Puchong',
            'Lifestyle frontage at TPK Park in Puchong': 'Yummy Nyonya Kitchen storefront at TPK Park, Puchong',
            'Bahagian hadapan kluster Lifestyle TPK Park di Puchong, digunakan sebagai imej konteks untuk panduan Yummy Nyonya Kitchen': 'Kedai Yummy Nyonya Kitchen di 43G, Jalan TPK 2/8, TPK Park, Puchong',
            'Bahagian hadapan Lifestyle TPK Park di Puchong': 'Kedai Yummy Nyonya Kitchen di TPK Park, Puchong',
            '蒲种TPK Park生活品味区的街景，作为Yummy Nyonya Kitchen页面的园区背景图片': '蒲种TPK Park Jalan TPK 2/8 43G的Yummy Nyonya Kitchen店面',
            '蒲种TPK Park生活品味区街景': '蒲种TPK Park的Yummy Nyonya Kitchen店面',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing alt text: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('docs/yummy-nyonya-profile-sources.md')
          s = p.read_text()
          pattern = r'## Photography\n\n.*?(?=\n## Integration and privacy)'
          replacement = '''## Photography\n\n- TPK Park management supplied a photograph of the Yummy Nyonya Kitchen premises on 16 September 2026. The photograph visibly shows the `YUMMY NYONYA KITCHEN / 好吃茶餐室` signage and the TPK Park awning, making it branch-specific first-party evidence.\n- The supplied photograph is used as the guide's hero and first visual-section image. It is resized and encoded as WebP for delivery only; no AI redraw, object replacement or stylistic alteration is used.\n- The standard brand-guide layout displays the photograph edge-to-edge beside the copy, without a separate image caption.\n- Because the photograph is now verified for this branch, the Restaurant schema may include the same local image URL.\n'''
          s, n = re.subn(pattern, replacement.rstrip(), s, count=1, flags=re.S)
          assert n == 1, n
          p.write_text(s)

          p = Path('scripts/validate-site.mjs')
          s = p.read_text()
          old = 'if (business?.telephone !== "+601111631126" || business?.url || business?.image || business?.openingHoursSpecification || business?.openingHours) fail(label, "Yummy Nyonya Kitchen must retain its verified phone without inferring a website, schema image or disputed hours");'
          new = 'if (business?.telephone !== "+601111631126" || business?.url || business?.image !== `${origin}/assets/images/yummy-nyonya-kitchen-tpk-800.webp` || business?.openingHoursSpecification || business?.openingHours) fail(label, "Yummy Nyonya Kitchen must retain its verified phone and branch photo without inferring a website or disputed hours");'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = 'if (page.heroImage !== "https://i.imgur.com/Z5h4hmH.jpg" || split?.image !== "https://i.imgur.com/Z5h4hmH.jpg") fail(label, "Yummy Nyonya Kitchen must use the TPK Park Lifestyle contextual image until a branch photo is verified");'
          new = 'if (page.heroImage !== `${origin}/assets/images/yummy-nyonya-kitchen-tpk-800.webp` || split?.image !== `${origin}/assets/images/yummy-nyonya-kitchen-tpk-800.webp`) fail(label, "Yummy Nyonya Kitchen must use the verified branch storefront photograph");'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit verified photograph and copy updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/yummy-nyonya-kitchen-tpk-800.webp scripts/yummy-nyonya-profile.mjs docs/yummy-nyonya-profile-sources.md scripts/validate-site.mjs
          git commit -m "Use Yummy Nyonya Kitchen branch photo"
          git push origin HEAD:codex/yummy-nyonya-photo

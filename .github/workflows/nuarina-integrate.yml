name: Integrate Nuarina guide

on:
  push:
    branches:
      - codex/nuarina-guide
    paths:
      - .github/workflows/nuarina-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nuarina-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch and optimise branch photograph
        run: |
          python -m pip install --quiet pillow
          curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://puchong.co/uploads/default/original/2X/f/f7b6717ac2c1b2540ea9b53375cb572766dc365e.jpeg" -o /tmp/nuarina-source.jpeg
          python -c "from PIL import Image,ImageOps; from pathlib import Path; im=ImageOps.exif_transpose(Image.open('/tmp/nuarina-source.jpeg')).convert('RGB'); print('source', im.size); im.thumbnail((1600,1600), Image.Resampling.LANCZOS); Path('assets/images').mkdir(parents=True,exist_ok=True); im.save('assets/images/nuarina-puchong-41g.webp','WEBP',quality=84,method=6); print('saved', im.size)"
      - name: Apply integration patch
        run: python scripts/tmp-nuarina-integrate.py
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit integrated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/nuarina-puchong-41g.webp scripts/site-data.mjs js/analytics.js js/ask-tpk.js scripts/validate-site.mjs scripts/validate-assistant.mjs scripts/validate-analytics.mjs README.md
          git commit -m "Integrate Nuarina guide across the site"
          git push origin HEAD:codex/nuarina-guide

name: Verify automotive amendments
on:
  push:
    branches:
      - codex/techtrics-techtra-supplied-revisions
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Candidate build and furnished revision checks
        run: |
          npm run build
          node scripts/validate-supplied-automotive.mjs
      - name: Candidate interaction suite
        run: |
          node --test scripts/validate-analytics.mjs scripts/validate-enquiry.mjs scripts/validate-assistant.mjs scripts/validate-assistant-upgrade.mjs scripts/validate-search-portfolio.mjs scripts/validate-speech.mjs > /tmp/interaction-tests.log 2>&1 || { grep -A22 -B2 '^not ok' /tmp/interaction-tests.log; tail -10 /tmp/interaction-tests.log; exit 1; }
          tail -12 /tmp/interaction-tests.log
      - uses: actions/checkout@v4
        if: always()
        with:
          persist-credentials: false
          ref: '4027995255c4151f0c6b8f2f7543831a643617f6'
          path: baseline
      - name: Unchanged baseline interaction suite
        if: always()
        working-directory: baseline
        run: |
          npm ci
          npm run build
          node --test scripts/validate-analytics.mjs scripts/validate-enquiry.mjs scripts/validate-assistant.mjs scripts/validate-assistant-upgrade.mjs scripts/validate-search-portfolio.mjs scripts/validate-speech.mjs > /tmp/baseline-interaction-tests.log 2>&1 || { grep -A22 -B2 '^not ok' /tmp/baseline-interaction-tests.log; tail -10 /tmp/baseline-interaction-tests.log; exit 1; }
          tail -12 /tmp/baseline-interaction-tests.log
      - name: Compare interaction failure names
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          def failures(path):
              return {re.sub(r'^not ok \d+ - ', '', line) for line in Path(path).read_text().splitlines() if line.startswith('not ok ')}
          baseline = failures('/tmp/baseline-interaction-tests.log')
          candidate = failures('/tmp/interaction-tests.log')
          print('Baseline failed tests:', sorted(baseline))
          print('Candidate failed tests:', sorted(candidate))
          print('New failures:', sorted(candidate - baseline))
          assert not candidate - baseline, 'Candidate introduced new interaction-test failures'
          PY

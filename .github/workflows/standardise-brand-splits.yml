name: Standardise brand guide split layout

on:
  push:
    branches:
      - codex/standardise-brand-splits
    paths:
      - .github/workflows/standardise-brand-splits.yml

permissions:
  contents: write

jobs:
  standardise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/standardise-brand-splits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Standardise tenant guide visual sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          brand_files = [
              'scripts/motd-profile.mjs',
              'scripts/lavino-profile.mjs',
              'scripts/ga-hing-profile.mjs',
              'scripts/kuche-bath-profile.mjs',
              'scripts/jubin-bms-profile.mjs',
              'scripts/v-haus-living-profile.mjs',
              'scripts/balens-design-profile.mjs',
              'scripts/builtop-profile.mjs',
              'scripts/premio-door-profile.mjs',
              'scripts/klot-profile.mjs',
              'scripts/dc-moto-profile.mjs',
              'scripts/fagolli-profile.mjs',
              'scripts/total-tools-profile.mjs',
              'scripts/baagus-profile.mjs',
              'scripts/mk-curtain-profile.mjs',
              'scripts/signature-profile.mjs',
              'scripts/choose-interior-profile.mjs',
              'scripts/perodua-kinrara-profile.mjs',
              'scripts/mazda-kinrara-profile.mjs',
              'scripts/kia-4s-service-profile.mjs',
              'scripts/techtrics-auto-profile.mjs',
              'scripts/techtra-automotive-academy-profile.mjs',
              'scripts/jon-detailing-profile.mjs',
              'scripts/jaecoo-service-centre-profile.mjs',
              'scripts/toyokar-profile.mjs',
              'scripts/jazmina-bistro-profile.mjs',
          ]

          changed = []
          for filename in brand_files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'Missing brand profile: {filename}')
              original = path.read_text()
              split_count = original.count('{ type: "split"')
              if split_count != 3:
                  raise SystemExit(f'{filename}: expected 3 localized split blocks, found {split_count}')

              lines = []
              for line in original.splitlines(keepends=True):
                  if '{ type: "split"' in line:
                      # Brand/tenant guides use the MOTD-style edge-to-edge split.
                      line = re.sub(r'presentation:\s*"[^"]+",\s*', '', line)
                      # Captions belong to the contained renewal figure, not this split format.
                      line = re.sub(r',\s*caption:\s*"(?:\\.|[^"\\])*"', '', line)
                      line = re.sub(r',\s*captionSource:\s*[A-Za-z_$][\w$]*', '', line)
                      line = re.sub(r',\s*captionSource:\s*\{[^{}]*\}', '', line)
                  lines.append(line)
              updated = ''.join(lines)

              for line in updated.splitlines():
                  if '{ type: "split"' in line and ('presentation:' in line or 'caption:' in line or 'captionSource:' in line):
                      raise SystemExit(f'{filename}: split block still contains renewal/caption metadata')
              if updated != original:
                  path.write_text(updated)
                  changed.append(filename)

          validator = Path('scripts/validate-site.mjs')
          text = validator.read_text()
          needle = '        if (page.business) {\n'
          addition = '''        if (page.business) {\n          const brandSplit = page.blocks?.find((block) => block.type === "split");\n          if (brandSplit?.presentation || brandSplit?.caption || brandSplit?.captionSource) fail(label, "Brand guides must use the MOTD-style edge-to-edge split without figure captions");\n          if (brandSplit && !html.includes('class="split section-sage"')) fail(label, "Brand guide split section is not using the standard edge-to-edge layout");\n'''
          if needle not in text:
              raise SystemExit('Business validation insertion point not found')
          text = text.replace(needle, addition, 1)

          old_mazda = 'if (business?.image !== `${origin}/assets/images/mazda-kinrara-exterior-1280.webp` || !page.heroAlt.includes("2016") || !page.blocks.find(block => block.type === "split")?.caption.includes("2016")) fail(label, "Mazda’s original branch photo must keep its archive date");'
          new_mazda = 'if (business?.image !== `${origin}/assets/images/mazda-kinrara-exterior-1280.webp` || !page.heroAlt.includes("2016")) fail(label, "Mazda’s original branch photo must keep its archive date");'
          if old_mazda not in text:
              raise SystemExit('Mazda caption validation target not found')
          validator.write_text(text.replace(old_mazda, new_mazda, 1))

          readme = Path('README.md')
          text = readme.read_text()
          marker = '- Keep each brand guide focused on its own business. Use the cluster directories to browse other brands; do not add cross-brand links or nearby-brand visit suggestions to individual guides. Retain relevant directions, official business links and source credits.\n'
          rule = '- Brand guide first visual sections use the same edge-to-edge image/copy split as MOTD. Do not use the contained `renewal` figure treatment or image captions on tenant guide pages.\n'
          if marker not in text:
              raise SystemExit('README brand-guide marker not found')
          if rule not in text:
              text = text.replace(marker, marker + rule, 1)
          readme.write_text(text)

          print(f'Updated {len(changed)} brand profile files:')
          for filename in changed:
              print(f'  - {filename}')
          PY
      - run: npm ci
      - name: Build and validate all generated pages
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit standardised brand layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/*-profile.mjs scripts/validate-site.mjs README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Standardise brand guide split layout"
            git push origin HEAD:codex/standardise-brand-splits
          fi

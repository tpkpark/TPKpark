name: Integrate Optimum Swim School guide

on:
  push:
    branches:
      - codex/optimum-swim-school-guide
    paths:
      - .github/workflows/optimum-swim-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/optimum-swim-school-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch and optimise official Puchong Kinrara photograph
        run: |
          python -m pip install --quiet pillow
          set +e
          curl -fL --retry 2 --retry-delay 2 -A "Mozilla/5.0" -e "https://optimumswimschool.com/our-branches/" \
            "https://optimumswimschool.com/wp-content/uploads/2026/06/IMG_3234-scaled.webp" -o /tmp/optimum-source
          first=$?
          if [ "$first" -ne 0 ] || ! python -c "from PIL import Image; Image.open('/tmp/optimum-source').verify()"; then
            curl -fL --retry 2 --retry-delay 2 -A "Mozilla/5.0" -e "https://optimumswimschool.com/our-branches/" \
              "https://optimumswimschool.com/wp-content/uploads/2026/04/PuchongKinrara-branch-img2.webp" -o /tmp/optimum-source
          fi
          set -e
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path('/tmp/optimum-source')
          out = Path('assets/images/optimum-swim-school-puchong-kinrara.webp')
          im = ImageOps.exif_transpose(Image.open(src)).convert('RGB')
          print('Official Puchong Kinrara source:', im.size, Image.open(src).format)
          if im.width > 1440:
              h = round(im.height * 1440 / im.width)
              im = im.resize((1440, h), Image.Resampling.LANCZOS)
          out.parent.mkdir(parents=True, exist_ok=True)
          im.save(out, 'WEBP', quality=84, method=6)
          data = out.read_bytes()
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          print('Optimised branch asset:', im.size, len(data), 'bytes')
          PY
      - name: Integrate route, SEO, assistant and analytics
        run: python scripts/tmp-optimum-swim-integrate.py
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit integrated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/optimum-swim-school-puchong-kinrara.webp scripts/site-data.mjs js/analytics.js js/ask-tpk.js scripts/validate-site.mjs scripts/validate-assistant.mjs scripts/validate-analytics.mjs README.md
          git commit -m "Integrate Optimum Swim School guide across the site"
          git push origin HEAD:codex/optimum-swim-school-guide

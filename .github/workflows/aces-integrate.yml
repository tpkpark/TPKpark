name: Integrate Aces Gymnastic Academy guide

on:
  push:
    branches:
      - codex/aces-gymnastic-academy-guide
    paths:
      - .github/workflows/aces-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aces-gymnastic-academy-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix multilingual directory matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-aces-integrate.py')
          s = p.read_text()
          old = r'''s, count = re.subn(r'(\["Gymnastics", "Aces Gymnastic Academy")\]', r'\1, "acesGymnasticAcademy"]', s)'''
          new = r'''s, count = re.subn(r'(\["[^"]+", "Aces Gymnastic Academy")\]', r'\1, "acesGymnasticAcademy"]', s)'''
          if old not in s:
              raise SystemExit('Aces directory matcher not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Integrate route, SEO, assistant and analytics
        run: python scripts/tmp-aces-integrate.py
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit integrated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/site-data.mjs js/analytics.js js/ask-tpk.js scripts/validate-site.mjs scripts/validate-assistant.mjs scripts/validate-analytics.mjs README.md
          git commit -m "Integrate Aces Gymnastic Academy guide across the site"
          git push origin HEAD:codex/aces-gymnastic-academy-guide

name: Integrate Nuarina guide

on:
  push:
    branches:
      - codex/nuarina-guide
    paths:
      - .github/workflows/nuarina-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nuarina-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch and optimise branch photograph
        run: |
          python -m pip install --quiet pillow
          curl -fL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
            "https://puchong.co/uploads/default/original/2X/f/f7b6717ac2c1b2540ea9b53375cb572766dc365e.jpeg" \
            -o /tmp/nuarina-source.jpeg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path('/tmp/nuarina-source.jpeg')
          out = Path('assets/images/nuarina-puchong-41g.webp')
          im = ImageOps.exif_transpose(Image.open(src)).convert('RGB')
          print('Nuarina source dimensions:', im.size)
          max_width = 1600
          if im.width > max_width:
              height = round(im.height * max_width / im.width)
              im = im.resize((max_width, height), Image.Resampling.LANCZOS)
          out.parent.mkdir(parents=True, exist_ok=True)
          im.save(out, 'WEBP', quality=84, method=6)
          data = out.read_bytes()
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          print('Optimised asset:', im.size, len(data), 'bytes')
          PY
      - name: Integrate route, SEO, assistant and analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one target, found {text.count(old)}')
              return text.replace(old, new, 1)

          # Site data / routes / SEO / directory.
          path = Path('scripts/site-data.mjs')
          text = path.read_text()
          anchor = 'import { jazminaBistroProfiles } from "./jazmina-bistro-profile.mjs";\n'
          text = replace_once(text, anchor, anchor + 'import { nuarinaProfiles } from "./nuarina-profile.mjs";\n', 'site import')
          anchor = '  jazminaBistro: "lifestyle/jazmina-bistro",\n'
          text = replace_once(text, anchor, anchor + '  nuarina: "lifestyle/nasi-lemak-nuarina",\n', 'route')

          seo_matches = list(re.finditer(r'^    jazminaBistro: "(?!lifestyle/|2026-)[^"]+",$', text, flags=re.M))
          if len(seo_matches) != 3:
              raise SystemExit(f'expected 3 Jazmina SEO title lines, found {len(seo_matches)}')
          titles = [
              '    nuarina: "Nasi Lemak Nuarina Puchong Kinrara | TPK Park",',
              '    nuarina: "Nasi Lemak Nuarina Puchong Kinrara | TPK Park",',
              '    nuarina: "Nasi Lemak Nuarina蒲种金銮 | TPK Park",',
          ]
          offset = 0
          for match, title in zip(seo_matches, titles):
              end = match.end() + offset
              text = text[:end] + '\n' + title + text[end:]
              offset += len('\n' + title)

          anchor = '  jazminaBistro: "2026-09-16",\n'
          text = replace_once(text, anchor, anchor + '  nuarina: "2026-09-16",\n', 'last modified')

          text, count = re.subn(r'(\["[^"]+", "Nasi Lemak Daun Pisang Nuarina")\]', r'\1, "nuarina"]', text)
          if count != 3:
              raise SystemExit(f'expected 3 Nuarina directory entries, updated {count}')

          for locale in ('en', 'ms', 'zh'):
              anchor = f'jazminaBistro: jazminaBistroProfiles.{locale},'
              replacement = anchor + f' nuarina: nuarinaProfiles.{locale},'
              text = replace_once(text, anchor, replacement, f'{locale} page map')
          path.write_text(text)

          # Analytics route allowlist, outbound menu/social and tenant phone attribution.
          path = Path('js/analytics.js')
          text = path.read_text()
          old = r'lifestyle(?:\/(?:motd|jazmina-bistro))?'
          new = r'lifestyle(?:\/(?:motd|jazmina-bistro|nasi-lemak-nuarina))?'
          text = replace_once(text, old, new, 'analytics route allowlist')
          phone_anchor = '    if (href === "tel:+60166626951") return click("tenant_contact_click", { contact_method: "phone", tenant: "motd" }, "motd:phone");\n'
          text = replace_once(text, phone_anchor, phone_anchor + '    if (href === "tel:+60122282290") return click("tenant_contact_click", { contact_method: "phone", tenant: "nasi-lemak-nuarina" }, "nasi-lemak-nuarina:phone");\n', 'Nuarina phone analytics')
          old = '''      } else if (["www.foodpanda.my", "foodpanda.my"].includes(url.hostname) && /^\\/restaurant\\/rlie\\/jazmina-bistro-rlie\\/?$/.test(url.pathname)) {
        click("outbound_click", { link_domain: "www.foodpanda.my" }, "jazmina-bistro:menu");
      } else if (["www.toyokar.my", "toyokar.my"].includes(url.hostname)) {'''
          new = '''      } else if (["www.foodpanda.my", "foodpanda.my"].includes(url.hostname) && /^\\/restaurant\\/rlie\\/jazmina-bistro-rlie\\/?$/.test(url.pathname)) {
        click("outbound_click", { link_domain: "www.foodpanda.my" }, "jazmina-bistro:menu");
      } else if (["www.foodpanda.my", "foodpanda.my"].includes(url.hostname) && /^\\/restaurant\\/qq2q\\/nasi-lemak-nuarina-since-2010\\/?$/.test(url.pathname)) {
        click("outbound_click", { link_domain: "www.foodpanda.my" }, "nasi-lemak-nuarina:menu");
      } else if (url.hostname === "m.me" && /^\\/aafiyah2018\\/?$/.test(url.pathname)) {
        click("outbound_click", { link_domain: "m.me" }, "nasi-lemak-nuarina:facebook");
      } else if (["www.toyokar.my", "toyokar.my"].includes(url.hostname)) {'''
          text = replace_once(text, old, new, 'Nuarina outbound analytics')
          path.write_text(text)

          # Ask TPK source-path allowlist.
          path = Path('js/ask-tpk.js')
          text = path.read_text()
          old = r'(?:motd|jazmina-bistro)'
          if text.count(old) != 1:
              raise SystemExit(f'Ask TPK lifestyle allowlist target count {text.count(old)}')
          text = text.replace(old, r'(?:motd|jazmina-bistro|nasi-lemak-nuarina)', 1)
          path.write_text(text)

          # Site validation and Nuarina-specific guardrails.
          path = Path('scripts/validate-site.mjs')
          text = path.read_text()
          anchor = '            jazminaBistro: { type: "Restaurant", contactUrl: "https://www.foodpanda.my/restaurant/rlie/jazmina-bistro-rlie" }\n'
          replacement = '            jazminaBistro: { type: "Restaurant", contactUrl: "https://www.foodpanda.my/restaurant/rlie/jazmina-bistro-rlie" },\n            nuarina: { type: "Restaurant", phone: "+60122282290" }\n'
          text = replace_once(text, anchor, replacement, 'validate expected map')
          insert_before = '          if (routeId === "jazminaBistro") {\n'
          nuarina_check = '''          if (routeId === "nuarina") {
            const split = page.blocks.find(block => block.type === "split");
            if (business?.address?.streetAddress !== "41G, Jalan TPK 2/8, Taman Perindustrian Kinrara" || business?.address?.postalCode !== "47180") fail(label, "Nuarina must retain its verified No. 41G TPK Park address");
            if (business?.telephone !== "+60122282290" || business?.url || business?.image || business?.openingHoursSpecification || business?.openingHours) fail(label, "Nuarina must retain its verified phone without inferring a website, schema image or disputed opening hours");
            if (page.heroImage !== `${origin}/assets/images/nuarina-puchong-41g.webp` || split?.image !== `${origin}/assets/images/nuarina-puchong-41g.webp`) fail(label, "Nuarina must use its branch-specific No. 41G photograph");
            if (!html.includes('href="https://www.foodpanda.my/restaurant/qq2q/nasi-lemak-nuarina-since-2010"') || !html.includes('href="tel:+60122282290"')) fail(label, "Nuarina must expose its current menu and verified phone");
            if (!html.includes("published closing times currently differ") && locale === "en") fail(label, "Nuarina must preserve the opening-hours uncertainty note");
          }
'''
          text = replace_once(text, insert_before, nuarina_check + insert_before, 'Nuarina site validation')
          path.write_text(text)

          # Assistant grounding regression checks.
          path = Path('scripts/validate-assistant.mjs')
          text = path.read_text()
          anchor = '    assert.deepEqual(sourceLinks(["jazminaBistro"], locale).map(source => source.url), [routePath(locale, "jazminaBistro")]);\n'
          addition = '''    assert.match(sources.nuarina.texts[locale], /41G, Jalan TPK 2\\/8/);
    assert.match(sources.nuarina.texts[locale], /\\+60 12 228 2290/);
    assert.match(sources.nuarina.texts[locale], /Nasi Lemak/);
    assert.deepEqual(sourceLinks(["nuarina"], locale).map(source => source.url), [routePath(locale, "nuarina")]);
'''
          text = replace_once(text, anchor, anchor + addition, 'assistant Nuarina assertions')
          path.write_text(text)

          # Analytics regression test.
          path = Path('scripts/validate-analytics.mjs')
          text = path.read_text()
          anchor = 'test("Jazmina Bistro menu and directions stay attributable without leaking URL details", () => {'
          pos = text.find(anchor)
          if pos < 0:
              raise SystemExit('Jazmina analytics test anchor missing')
          # Insert Nuarina test immediately before Jazmina test to keep restaurant tests together.
          test_block = '''test("Nuarina menu, maps and calls stay attributable without leaking visitor data", () => {
  const page = client({ saved: "detailed", locale: "en" });
  page.clickLink("/lifestyle/nasi-lemak-nuarina/");
  page.clickLink("/ms/lifestyle/nasi-lemak-nuarina/", ".locale-nav");
  page.clickLink("https://www.foodpanda.my/restaurant/qq2q/nasi-lemak-nuarina-since-2010?order=PRIVATE123&email=private@example.com#private");
  page.clickLink("https://m.me/aafiyah2018?ref=private@example.com");
  page.clickLink("https://maps.app.goo.gl/G3W9LGDYd4kUX9qW9?private=private@example.com");
  page.clickLink("https://www.waze.com/ul?q=Nasi%20Lemak%20PRIVATE123&navigate=yes");
  page.clickLink("tel:+60122282290");
  assert.deepEqual(page.basicSent().map(event => event.name), ["navigation_click", "language_switch", "outbound_click", "outbound_click", "directions_click", "directions_click", "tenant_contact_click"]);
  assert.equal(page.basicSent()[2].data.target, "nasi-lemak-nuarina:menu");
  assert.equal(page.basicSent()[3].data.target, "nasi-lemak-nuarina:facebook");
  assert.equal(page.basicSent().at(-1).data.target, "nasi-lemak-nuarina:phone");
  assert.equal(page.sent().at(-1)[2].tenant, "nasi-lemak-nuarina");
  assert.doesNotMatch(JSON.stringify([page.sent(), page.basicSent()]), /PRIVATE123|private@example.com|60122282290|G3W9LG/);
  page.controls.off.handlers.click();
  page.clickLink("tel:+60122282290");
  assert.equal(page.basicSent().length, 7);
});

'''
          text = text[:pos] + test_block + text[pos:]
          path.write_text(text)

          # README counts/list/source documentation.
          path = Path('README.md')
          text = path.read_text()
          text = text.replace('generates 40 routes for each language (120 HTML pages)', 'generates 41 routes for each language (123 HTML pages)', 1)
          text = text.replace('bringing the total to 123.', 'bringing the total to 126.', 1)
          text = text.replace('Toyokar and Jazmina Bistro business guides.', 'Toyokar, Jazmina Bistro and Nasi Lemak Daun Pisang Nuarina business guides.', 1)
          text = text.replace('`scripts/toyokar-profile.mjs` and `scripts/jazmina-bistro-profile.mjs`;', '`scripts/toyokar-profile.mjs`, `scripts/jazmina-bistro-profile.mjs` and `scripts/nuarina-profile.mjs`;', 1)
          text = text.replace('[Toyokar guide sources](docs/toyokar-profile-sources.md) and [Jazmina Bistro guide sources](docs/jazmina-bistro-profile-sources.md).', '[Toyokar guide sources](docs/toyokar-profile-sources.md), [Jazmina Bistro guide sources](docs/jazmina-bistro-profile-sources.md) and [Nuarina guide sources](docs/nuarina-profile-sources.md).', 1)
          text = text.replace('The sitemap contains all 123 canonical pages.', 'The sitemap contains all 126 canonical pages.', 1)
          path.write_text(text)
          PY
      - run: npm ci
      - name: Build and validate site
        run: |
          npm run build
          npm run validate
      - name: Run relevant regression tests
        run: node --test scripts/validate-analytics.mjs scripts/validate-assistant.mjs scripts/validate-search-portfolio.mjs
      - name: Commit integrated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/nuarina-puchong-41g.webp scripts/site-data.mjs js/analytics.js js/ask-tpk.js scripts/validate-site.mjs scripts/validate-assistant.mjs scripts/validate-analytics.mjs README.md
          git commit -m "Integrate Nuarina guide across the site"
          git push origin HEAD:codex/nuarina-guide
